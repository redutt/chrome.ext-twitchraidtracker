<!DOCTYPE html>
<html lang="en">
<head>
    <title>Raid Tracker</title>
    <!--suppress CssUnusedSymbol -->
    <style>
        body {
            width: 340px;
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #1f1f23;
            color: #fff
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input, select {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 0;
        }

        .raid-item {
            border-bottom: 1px solid #e5e5e5;
            padding: 10px 0;
            font-size: 13px;
        }

        .raid-item:last-child {
            border-bottom: none;
        }

        .time {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 12px;
        }

        button {
            padding: 6px 12px;
            border: none;
            background: #9146FF;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #772ce8;
        }
    </style>
</head>
<body>
<!--<h3>Raid History</h3>-->
<div class="controls">
    <!--suppress HtmlFormInputWithoutLabel -->
    <input id="search-input" placeholder="Search channels..." type="text"/>
    <!--suppress HtmlFormInputWithoutLabel -->
    <select id="period-filter">
        <option selected value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
        <option value="2160">Last 90 days</option>
        <option value="all">All time</option>
    </select>
</div>

<div id="raid-list">Loading...</div>

<div class="pagination">
    <button id="prev-btn"><<</button>
    <span id="page-info">1</span>
    <button id="next-btn">>></button>
</div>
<script src="popup.js" type="module"></script>
</body>
</html>
